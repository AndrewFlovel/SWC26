services:
  backend:
    build: ./backend
    container_name: swc26-backend
    ports:
      - "8001:8001"
    volumes:
      # Persist recorded match results (results.json) across rebuilds.
      - ./backend/app/data:/srv/app/data
    # Match the host user so files written to the volume stay editable.
    user: "1000:1000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: swc26-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
